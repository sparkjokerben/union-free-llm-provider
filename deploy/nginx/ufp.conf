# ufp 的 nginx 反向代理配置
#
# 分工：nginx 负责 TLS 终结与 HTTP/2（证书用 acme.sh 申请、自动续期），
# 网关只监听 127.0.0.1，不碰证书。
#
# 安装：
#   1) apk add nginx
#   2) cp deploy/nginx/ufp.conf /etc/nginx/http.d/ufp.conf（Alpine 用 http.d）
#      或 /etc/nginx/conf.d/ufp.conf（Debian/Ubuntu）
#   3) 把 example.com 换成你的域名；证书路径来自 acme.sh：
#        acme.sh --issue --nginx -d example.com
#        acme.sh --install-cert -d example.com \
#          --key-file /etc/nginx/certs/example.com.key \
#          --fullchain-file /etc/nginx/certs/example.com.crt \
#          --reloadcmd "rc-service nginx reload"
#   4) nginx -t && rc-service nginx reload
#
# 流式响应的关键三行：proxy_buffering off、proxy_read_timeout 拉长、
# HTTP/1.1 + 空 Connection（让上游保持长连接、支持 chunked）。

# 上游（网关）只在本机。注意 upstream 必须定义在 http 层，不能放在 server 块里。
upstream ufp_gateway {
    server 127.0.0.1:8787;
    keepalive 16;
}

# ---- HTTP：只做证书校验与跳转 ----
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # acme.sh 的 webroot 校验（用 --nginx 模式时也可以去掉）
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS：真正的入口 ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/nginx/certs/example.com.crt;
    ssl_certificate_key /etc/nginx/certs/example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # 不要在这里再声明 ssl_session_cache：Alpine 的 nginx.conf 已经在 http 层
    # 声明过共享内存区，重复声明会以 "conflicts with already declared size" 启动失败。
    ssl_session_timeout 1d;

    # 请求体上限：与网关的 UFP_MAX_BODY_BYTES 保持一致（Claude Code 的长上下文）
    client_max_body_size 32m;
    client_body_timeout  300s;

    # ---- Claude Code 走这里 ----
    location /v1/ {
        proxy_pass http://ufp_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式（SSE）必须关缓冲，否则响应会被整段攒住
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        # 单次请求可能持续十几分钟（长思考 + 多轮工具调用）
        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }

    # ---- 管理后台 ----
    location /admin {
        proxy_pass http://ufp_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # 想把后台限制成固定来源，取消下面两行的注释：
        # allow 203.0.113.10;
        # deny all;
    }

    # ---- 探活（给 OpenRC / 监控用，也可只从内网访问） ----
    location = /healthz {
        proxy_pass http://ufp_gateway;
        proxy_set_header Host $host;
        access_log off;
    }

    # 兜底：交给网关自己处理（根路径给落地页，其余路径它自己回 404）
    location / {
        proxy_pass http://ufp_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
