[package]
name = "ufp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "统一 LLM 中转网关：下游 Anthropic Messages / 单模型 id / 多下游 key，上游聚合免费额度池"

[dependencies]
ufp-convert = { path = "../ufp-convert" }

# HTTP 服务与出站
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip", "deflate", "brotli", "zstd", "socks"] }
socket2 = { version = "0.5", features = ["all"] }
mimalloc = { version = "0.1", default-features = false }

# 序列化与工具
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
bytes = "1"
futures = "0.3"
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
argon2 = "0.5"
subtle = "2"
arc-swap = "1"

# 存储
rusqlite = { version = "0.37", features = ["bundled"] }

# 观测与告警
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
tempfile = "3"
