<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ufp 调度台</title>
<style>
/* ── 设计 token ─────────────────────────────────────────────────────────
   主题：一台调度台。上游是一池不稳定的免费额度，界面要让人一眼看出
   「谁在正常、谁在冷却、谁被熔断」。冷调纸面 + 三色状态语义，
   颜色只承载状态，不做装饰。 */
:root {
  color-scheme: light;
  --paper:  #edf0ed;   /* 纸面：微冷的灰绿白 */
  --card:   #f7f9f7;
  --ink:    #14201d;   /* 墨：偏绿的深黑 */
  --ink-2:  #4a5a55;
  --ink-3:  #7d8c87;
  --line:   #ccd6d1;
  --line-2: #e0e7e3;
  --live:   #0d7a68;   /* 在线 */
  --live-b: #d7ece6;
  --hold:   #a35f00;   /* 冷却 / 等待 */
  --hold-b: #f4e6cf;
  --fail:   #9d2f28;   /* 熔断 / 失败 */
  --fail-b: #f3dbd8;
  --skip:   #6b7a86;   /* 跳过（超长 / 无能力） */
  --skip-b: #e3e8eb;
  --shadow: 0 1px 2px rgba(20,32,29,.06), 0 8px 24px -12px rgba(20,32,29,.18);
  --serif: "Songti SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --sans: -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono: ui-monospace,"SF Mono","JetBrains Mono",Menlo,"Cascadia Mono",monospace;
  --r: 3px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0f1513; --card: #161d1a; --ink: #e9eeec; --ink-2: #a7b3ae;
    --ink-3: #78857f; --line: #2a3531; --line-2: #202925;
    --live: #4fc3a8; --live-b: #16302a; --hold: #e0a458; --hold-b: #33260f;
    --fail: #e0796f; --fail-b: #331a17; --skip: #9aa7b0; --skip-b: #1d2427;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
* { box-sizing: border-box }
/* hidden 属性必须真的生效：作者样式里的 display:grid/flex 会盖掉浏览器默认的
   [hidden]{display:none}（UA 样式永远输给作者样式，与权重无关），
   于是 .shell.hidden = true 只是摆设 —— 退出登录后控制台还留在屏幕上。 */
[hidden] { display: none !important }
html, body { margin: 0; background: var(--paper); color: var(--ink) }
body { font: 14px/1.65 var(--sans); -webkit-font-smoothing: antialiased }
a { color: var(--live); text-underline-offset: 3px }
code, .mono { font-family: var(--mono); font-size: .92em }
:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; border-radius: var(--r) }

/* ── 骨架：顶部读数带 + 左机架 + 右工作台 ─────────────────────────── */
/* align-content: start 不能省：min-height:100vh 多出来的空间默认会被分给各行
   （align-content 默认 stretch），顶部读数带那一行于是被撑高，内容少的时候
   （池子空着、页面稀疏）就在标题下面多出一条两百多像素的空白。 */
.shell { display: grid; grid-template-columns: 268px minmax(0,1fr); align-content: start; min-height: 100vh }
.top { grid-column: 1/-1; position: sticky; top: 0; z-index: 20;
       display: flex; align-items: baseline; gap: 22px; flex-wrap: wrap;
       padding: 10px 20px; border-bottom: 1px solid var(--line);
       background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(6px) }
.top .brand { font-family: var(--serif); font-size: 17px; letter-spacing: .01em }
.readout { display: flex; gap: 18px; flex-wrap: wrap; font-family: var(--mono); font-size: 12px; color: var(--ink-2) }
.readout b { font-family: var(--serif); font-size: 15px; color: var(--ink); font-weight: 600; margin-right: 4px }
.top .grow { flex: 1 }
.top button { margin-left: 0 }

.rail { border-right: 1px solid var(--line); padding: 16px 14px 40px; align-self: start;
        position: sticky; top: 45px; max-height: calc(100vh - 45px); overflow: auto }
.rail h2, .sec h2 { font-family: var(--serif); font-size: 13px; font-weight: 600;
                    color: var(--ink-2); margin: 0 0 8px }
.tier { margin-bottom: 14px }
.tier-head { display: flex; align-items: baseline; gap: 6px; font-size: 12px; color: var(--ink-3); margin-bottom: 4px }
.tier-head::after { content: ""; flex: 1; border-top: 1px dotted var(--line) }
.slot { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 8px;
        padding: 5px 6px; border-radius: var(--r); cursor: default }
.slot:hover { background: var(--card) }
.slot .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px }
.slot .sub { font-family: var(--mono); font-size: 11px; color: var(--ink-3); grid-column: 2/-1 }
.lamp { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 0 3px var(--live-b) }
.lamp.live { background: var(--live); box-shadow: 0 0 0 3px var(--live-b) }
.lamp.hold { background: var(--hold); box-shadow: 0 0 0 3px var(--hold-b) }
.lamp.fail { background: var(--fail); box-shadow: 0 0 0 3px var(--fail-b) }
.lamp.skip { background: var(--skip); box-shadow: 0 0 0 3px var(--skip-b) }

.work { padding: 22px 26px 80px; min-width: 0 }
nav.pages { display: flex; gap: 2px; flex-wrap: wrap; margin-bottom: 20px; border-bottom: 1px solid var(--line) }
nav.pages button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--ink-2);
                   padding: 7px 11px; font: inherit; cursor: pointer; margin-bottom: -1px }
nav.pages button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--live); font-weight: 600 }
nav.pages button:hover { color: var(--ink) }
section { display: none } section.on { display: block }

/* ── 内容块：排班表式的密表，不用卡片堆 ───────────────────────────── */
.sec { margin-bottom: 26px }
.sec > h2 { font-size: 14px; color: var(--ink) }
.note { color: var(--ink-2); font-size: 13px; max-width: 78ch; margin: 0 0 12px }
table { width: 100%; border-collapse: collapse; font-size: 13px;
        font-variant-numeric: tabular-nums }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top }
th { color: var(--ink-3); font-weight: 500; font-size: 12px; white-space: nowrap;
     position: sticky; top: 45px; background: var(--paper) }
tbody tr:hover td { background: var(--card) }
td.num, th.num { text-align: right; font-family: var(--mono) }
.tag { display: inline-block; padding: 0 6px; border-radius: var(--r); font-size: 11px;
       border: 1px solid var(--line); color: var(--ink-2) }
.tag.live { color: var(--live); border-color: var(--live); background: var(--live-b) }
.tag.hold { color: var(--hold); border-color: var(--hold); background: var(--hold-b) }
.tag.fail { color: var(--fail); border-color: var(--fail); background: var(--fail-b) }
.empty { color: var(--ink-3); padding: 14px 10px; font-size: 13px }

/* ── 控件 ─────────────────────────────────────────────────────────── */
button { font: inherit; cursor: pointer; border-radius: var(--r); border: 1px solid var(--line);
         background: var(--card); color: var(--ink); padding: 5px 11px }
button:hover { border-color: var(--ink-3) }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink) }
button.ghost { background: none }
button.danger { color: var(--fail); border-color: var(--fail-b); background: none }
button.tiny { padding: 2px 7px; font-size: 12px }
/* 导入链接得是真链接：由浏览器交给操作系统的 ccswitch:// 处理器，不能是 JS 跳转 */
a.btn { display: inline-block; padding: 5px 11px; border-radius: var(--r);
        border: 1px solid var(--line); background: var(--card); color: var(--ink);
        text-decoration: none; font: inherit }
a.btn:hover { border-color: var(--ink-3) }
a.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink) }
input, select, textarea { font: inherit; background: var(--card); color: var(--ink);
                          border: 1px solid var(--line); border-radius: var(--r); padding: 5px 8px; width: 100% }
textarea { min-height: 120px; font-family: var(--mono); font-size: 12px }
label.f { display: block; margin-bottom: 10px }
label.f span { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 3px }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px }
.row > * { width: auto }
.row input, .row textarea { width: auto; flex: 1; min-width: 140px }
/* 上一条只该管文本框：勾选框也被拉到 140px 宽，和它的文字隔出一大段空白 */
.row input[type="checkbox"], .row input[type="radio"] { flex: none; min-width: 0; margin: 0 4px 0 0; vertical-align: -1px }
.row input.narrow { flex: none; min-width: 0; width: 72px }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 14px }

/* ── 尝试色带：池子的心电图 ───────────────────────────────────────── */
.pulse { display: flex; align-items: flex-end; gap: 2px; height: 46px; margin: 2px 0 6px }
.pulse i { flex: 1; min-width: 2px; border-radius: 1px; background: var(--line); display: block }
.pulse i.live { background: var(--live) } .pulse i.hold { background: var(--hold) }
.pulse i.fail { background: var(--fail) } .pulse i.skip { background: var(--skip) }
.pulse-legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap }
.pulse-legend .k { display: inline-flex; align-items: center; gap: 5px }
.pulse-legend .k::before { content: ""; width: 9px; height: 9px; border-radius: 1px; background: var(--line) }
.pulse-legend .k.live::before { background: var(--live) } .pulse-legend .k.hold::before { background: var(--hold) }
.pulse-legend .k.fail::before { background: var(--fail) } .pulse-legend .k.skip::before { background: var(--skip) }

/* 趋势：一天一根竖条，成功在下、错误在上 */
.trend { display: flex; align-items: flex-end; gap: 3px; height: 120px; padding-top: 6px }
.trend .d { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; min-width: 6px }
.trend .d i { display: block; background: var(--live); border-radius: 1px }
.trend .d i.err { background: var(--fail) }
.trend-x { display: flex; gap: 3px; font-family: var(--mono); font-size: 10px; color: var(--ink-3) }
.trend-x span { flex: 1; min-width: 6px; text-align: center; overflow: hidden }

/* ── 测试结果 ─────────────────────────────────────────────────────── */
.probe { font-family: var(--mono); font-size: 12px; margin-top: 4px }
.probe.ok { color: var(--live) } .probe.bad { color: var(--fail) } .probe.run { color: var(--ink-3) }
.probe.hold { color: var(--hold) }
.probe .when { color: var(--ink-3) }
.slot .sub:empty { display: none }

/* ── 预设与模型列表 ───────────────────────────────────────────────────── */
.presets { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; margin-top: 6px }
.preset { display: grid; gap: 3px; text-align: left; padding: 10px 12px; background: var(--card) }
.preset b { font-family: var(--serif); font-size: 14px; font-weight: 600 }
.preset span { font-size: 12px; color: var(--ink-2); line-height: 1.5 }
.preset:hover { border-color: var(--live) }
.models { max-height: 44vh; overflow: auto; border: 1px solid var(--line-2); border-radius: var(--r) }
.models label { display: grid; grid-template-columns: 18px minmax(0,1fr) auto; gap: 2px 8px; align-items: baseline;
                padding: 6px 10px; border-bottom: 1px solid var(--line-2); cursor: pointer }
.models label:hover { background: var(--paper) }
.models label.off { cursor: default; color: var(--ink-3) }
.models input { width: auto; margin: 0 }
.models .mid { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere }
.models .ctx { font-family: var(--mono); font-size: 11px; color: var(--ink-3); white-space: nowrap }
.models .meta { grid-column: 2 / -1; font-size: 11px; color: var(--ink-3) }
.models .meta:empty { display: none }

/* ── 对话框与提示 ─────────────────────────────────────────────────── */
dialog { border: 1px solid var(--line); border-radius: var(--r); background: var(--card); color: var(--ink);
         padding: 20px 22px; width: min(680px, 92vw); box-shadow: var(--shadow) }
dialog::backdrop { background: rgba(10,16,14,.5) }
dialog h2 { font-family: var(--serif); font-size: 16px; margin: 0 0 12px }
#toasts { position: fixed; right: 16px; bottom: 16px; z-index: 60; display: grid; gap: 8px; max-width: min(420px, 90vw) }
#toasts div { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--live);
              border-radius: var(--r); padding: 8px 12px; font-size: 13px; box-shadow: var(--shadow);
              animation: rise .22s ease-out both }
#toasts div.bad { border-left-color: var(--fail) }
@keyframes rise { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
@media (prefers-reduced-motion: reduce) { #toasts div { animation: none } }

/* ── 登录 ─────────────────────────────────────────────────────────── */
.gate { max-width: 340px; margin: 14vh auto; padding: 0 20px }
.gate h1 { font-family: var(--serif); font-size: 20px; margin: 0 0 4px }
.gate p { color: var(--ink-2); font-size: 13px }

/* ── 窄屏：机架收成一条状态带，表格转成键值行 ─────────────────────── */
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr }
  .rail { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); padding-bottom: 14px }
  .rail .tier { display: inline-block; vertical-align: top; margin-right: 16px }
  .work { padding: 16px 16px 60px }
  th { position: static }
  table, tbody, tr, td { display: block; width: 100% }
  thead { display: none }
  tbody tr { border-bottom: 1px solid var(--line); padding: 8px 0 }
  td { border: 0; padding: 2px 0 }
  /* 每一格都带上列名。数字格原来被排除在外，于是「0.1 小时」「0 / 32」这类值
     在窄屏上孤零零地右对齐飘着，跟它那一行的标签对不上号。 */
  td::before { content: attr(data-k) "　"; color: var(--ink-3); font-size: 11px }
  td.num { text-align: left }
}
</style>
</head>
<body>

<div class="shell" hidden>
  <header class="top">
    <span class="brand">ufp 调度台</span>
    <div class="readout" id="readout"></div>
    <span class="grow"></span>
    <button class="ghost tiny" id="refresh" hx-ignore>刷新</button>
    <button class="ghost tiny" id="logout">退出</button>
  </header>

  <aside class="rail" id="rail"></aside>

  <main class="work">
    <nav class="pages" id="pages"></nav>
    <section id="p-overview" class="on"></section>
    <section id="p-stats"></section>
    <section id="p-requests"></section>
    <section id="p-pool"></section>
    <section id="p-health"></section>
    <section id="p-downstream"></section>
    <section id="p-search"></section>
    <section id="p-rules"></section>
    <section id="p-settings"></section>
  </main>
</div>

<div class="gate" id="gate" hidden>
  <h1>ufp 调度台</h1>
  <p id="gate-msg">输入后台密码。</p>
  <label class="f"><span>密码</span><input type="password" id="pw" autocomplete="current-password"></label>
  <button class="primary" id="do-login">进入</button>
</div>

<!-- 脚本压根没跑起来时的兜底。它必须在 .shell 外面：脚本没跑，.shell 就一直是
     hidden（现在 hidden 是真的生效了），写在里面的提示等于没写。 -->
<div class="gate" id="bootfail" hidden>
  <h1>界面脚本没有跑起来</h1>
  <p>先强制刷新一次（Mac：Cmd+Shift+R，Windows：Ctrl+F5）；如果还不行，打开浏览器控制台看看报什么错。</p>
</div>

<dialog id="dlg"><div id="dlg-body"></div></dialog>
<div id="toasts"></div>
<noscript><p class="note" style="padding:20px">这个后台需要 JavaScript。</p></noscript>
<script src="/admin/app.js?v=__UFP_VERSION__"></script>
<script>
// 看 app.js 有没有真的跑起来（它一开始就把 __ufpBooted 置上）。
setTimeout(function () {
  if (window.__ufpBooted) return;
  var el = document.getElementById('bootfail');
  if (el) el.hidden = false;
}, 2500);
</script>
</body>
</html>
