name: deploy

# 手动部署：默认下发最近一次 Release 的产物；也可以指定 tag。
# 先跑 dry_run 能确认「Runner 连得上服务器 + 服务器架构识别正确」而不动服务器。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要部署的 tag（例如 v0.1.0；留空=最近一次 Release）"
        required: false
      dry_run:
        description: "只探测连通性与架构，不改服务器"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve_tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
            echo "未指定 tag，使用最近一次 Release：$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve_tag
    uses: ./.github/workflows/_deploy.yml
    with:
      tag: ${{ needs.resolve_tag.outputs.tag }}
      artifacts_from: release
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
