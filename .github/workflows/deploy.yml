name: deploy

# 手动部署：把指定 tag（默认最近一次 Release）的产物通过域名推给网关。
# 先跑 dry_run 能确认域名可达、healthz 正常，而不推送任何东西。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要部署的 tag（例如 v0.1.0；留空=最近一次 Release）"
        required: false
      dry_run:
        description: "只验证域名可达（不推送、不改服务器）"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve_tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
            if [ -z "$TAG" ]; then
              if [ "${{ inputs.dry_run }}" = "true" ]; then
                echo "::notice::仓库里还没有 Release；dry_run 不需要产物，继续探测"
                TAG="dry-run"
              else
                echo "::error::还没有任何 Release：先打一个 tag 触发 release 工作流，或在输入里填 tag" >&2
                exit 1
              fi
            else
              echo "未指定 tag，使用最近一次 Release：$TAG"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve_tag
    uses: ./.github/workflows/_deploy-http.yml
    with:
      tag: ${{ needs.resolve_tag.outputs.tag }}
      artifacts_from: release
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
