name: _diag

# 临时诊断：GitHub 托管 runner 到底有没有 IPv6 出口、能不能连到目标服务器。
# 这个工作流不碰任何密钥，用完可以删。
on:
  workflow_dispatch:

jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 系统与地址
        run: |
          set +e
          echo "== uname:"; uname -a
          echo "== 全局 IPv6 地址:"; ip -6 addr show scope global
          echo "== IPv6 路由:"; ip -6 route show
          echo "== IPv4 地址（对比）:"; ip -4 addr show scope global | head -5

      - name: IPv6 出网测试
        run: |
          set +e
          echo "== curl -6 api64.ipify.org:"
          curl -6 -s --max-time 10 https://api64.ipify.org || echo "(失败)"
          echo
          echo "== curl -6 google ipv6 测试站:"
          curl -6 -s -o /dev/null -w "%{http_code}\n" --max-time 10 https://ipv6.google.com/ || echo "(失败)"
          echo "== curl -6 raw.githubusercontent.com:"
          curl -6 -s -o /dev/null -w "%{http_code}\n" --max-time 10 https://raw.githubusercontent.com/ || echo "(失败)"

      - name: 连目标服务器 22 端口（IPv6）
        run: |
          set +e
          HOST=2001:19f0:5401:fd6:5400:6ff:feba:32a9
          echo "== ping6:"
          ping6 -c 2 -W 3 "$HOST" || echo "(ping6 失败)"
          echo "== TCP 22:"
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/$HOST/22" && echo "22 端口可达" || echo "22 端口不可达"
          echo "== nc:"
          (command -v nc && nc -6 -vz -w 8 "$HOST" 22) || echo "(没有 nc 或连接失败)"

      - name: 反向对照（IPv4 出网）
        run: |
          set +e
          echo "== curl -4 api.ipify.org:"
          curl -4 -s --max-time 10 https://api.ipify.org || echo "(失败)"
