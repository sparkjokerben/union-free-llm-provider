name: release

# 打 tag（v0.1.0）时：编两个架构的 musl 静态二进制 → 发布 Release → 自动部署到服务器。
# 手动重跑：Actions 里选 deploy 工作流（不重新编译，直接下发已发布的产物）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "只为这个 tag 重新发布（留空表示只做一次构建自检，不发布不部署）"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # cross 用容器里的 musl 工具链编译，rusqlite 的 bundled SQLite 也能过
      - name: Install cross
        run: cargo install cross --locked

      - name: Build
        run: cross build --release --workspace --target ${{ matrix.target }}

      - name: Package
        run: |
          set -eu
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ufp dist/ufp-${{ matrix.target }}
          strip dist/ufp-${{ matrix.target }} || true
          cd dist && sha256sum ufp-${{ matrix.target }} > ufp-${{ matrix.target }}.sha256
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: ufp-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          body: |
            下载与服务器架构对应的静态二进制（Alpine 上不需要任何运行时依赖）：

            - x86_64 服务器：`ufp-x86_64-unknown-linux-musl`
            - ARM 服务器（Oracle/Ampere 等）：`ufp-aarch64-unknown-linux-musl`

            部署见 `deploy/`：OpenRC 服务脚本、nginx 配置、安装脚本；
            打 tag 时本仓库会自动部署到服务器（经 Cloudflare 代理的 `/admin/api/deploy`）。

  # 把二进制发布到 dist 分支：源站是 IPv6-only，拉不到 GitHub Release 资产，
  # 但 raw.githubusercontent.com（Fastly）在 v6 上可达 —— 首次安装与人工拉取都靠它。
  publish-dist-branch:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 推送到 dist 分支
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          git config user.name "ufp release bot"
          git config user.email "actions@users.noreply.github.com"
          # 独立分支，只放最新版本（每次 orphan 提交，历史保持干净）
          git checkout --orphan dist-new
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p binaries
          cp dist/ufp-x86_64-unknown-linux-musl dist/ufp-aarch64-unknown-linux-musl binaries/
          cp deploy/bootstrap.sh binaries/
          cp deploy/ufp-apply-deploy binaries/
          cp deploy/remote-deploy.sh binaries/
          cp deploy/openrc/ufp binaries/ufp-openrc
          cp deploy/nginx/ufp.conf binaries/ufp-nginx.conf
          python3 - <<'PYEOF'
          import hashlib, json, os, pathlib
          tag = os.environ["TAG"]
          files = {}
          for p in sorted(pathlib.Path("binaries").iterdir()):
              data = p.read_bytes()
              files[p.name] = {
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size": len(data),
              }
          pathlib.Path("latest.json").write_text(
              json.dumps({"tag": tag, "files": files}, indent=2, ensure_ascii=False) + "\n"
          )
          print(pathlib.Path("latest.json").read_text())
          PYEOF
          git add -A
          git commit -q -m "dist: $TAG"
          git push -f origin HEAD:dist
          echo "::notice::已发布到 dist 分支：$TAG"

  # 自动部署：编译完 → 发 Release → 通过域名把发布包推给网关（Cloudflare 代理转发到 v6 源站）
  deploy:
    needs: [build, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    uses: ./.github/workflows/_deploy-http.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
      artifacts_from: local
    secrets: inherit
